<!doctype html>
<html><head><meta charset="utf-8"><title>Independent GLB viewer</title>
<script type="importmap">{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }</script>
<style>html,body{margin:0;background:#ddd}</style></head>
<body><script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(1000, 700); document.body.appendChild(r.domElement)
const scene = new THREE.Scene(); scene.background = new THREE.Color('#e6dfd5')
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture
const gltf = await new GLTFLoader().loadAsync('/model.glb')
scene.add(gltf.scene)
const box = new THREE.Box3().setFromObject(gltf.scene), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3())
let meshes = 0, textures = 0; gltf.scene.traverse((o) => { if (o.isMesh) { meshes++; if (o.material.map) textures++ } })
const cam = new THREE.PerspectiveCamera(35, 1000 / 700, 0.001, 100); const d = size.length() * 1.6
cam.position.set(c.x + d * 0.55, c.y + d * 0.5, c.z + d * 0.7); cam.lookAt(c)
scene.add(new THREE.DirectionalLight(0xffffff, 2.5).translateX(-1).translateY(2).translateZ(1))
r.render(scene, cam)
window.result = { meshes, textures, size: size.toArray(), extensions: gltf.parser.json.extensionsUsed ?? [] }
</script></body></html>
